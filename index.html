<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>올인원 여행 플래너 & 쇼핑 체크리스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .active-tab {
            color: #2563eb;
            border-top: 2px solid #2563eb;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-20">

    <!-- 상단 헤더 -->
    <header class="bg-blue-600 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-plane-departure"></i> 스마트 여행 플래너
            </h1>
            <span id="current-date" class="text-xs bg-blue-700 px-2 py-1 rounded"></span>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="max-w-md mx-auto p-4">

        <!-- 탭 1: 일정 관리 -->
        <section id="tab-itinerary" class="tab-content space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm">
                <h2 class="font-bold text-lg mb-3 text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-calendar-days text-blue-500"></i> 여행 일정
                </h2>
                <div class="flex gap-2 mb-3">
                    <input type="text" id="itinerary-input" placeholder="일정을 입력하세요 (예: 10:00 루브르 박물관)" class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button onclick="addItinerary()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700">추가</button>
                </div>
                <ul id="itinerary-list" class="space-y-2">
                    <!-- 일정 목록 출력 -->
                </ul>
            </div>
        </section>

        <!-- 탭 2: 준비물 / 쇼핑 체크리스트 -->
        <section id="tab-shopping" class="tab-content hidden space-y-4">
            <!-- 쇼핑 및 준비물 리스트 -->
            <div class="bg-white p-4 rounded-xl shadow-sm">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-bold text-lg text-gray-800 flex items-center gap-2">
                        <i class="fa-solid fa-cart-shopping text-emerald-500"></i> 쇼핑 & 준비물 리스트
                    </h2>
                    <span id="shopping-stats" class="text-xs text-gray-500">0/0 완료</span>
                </div>
                <div class="flex gap-2 mb-3">
                    <input type="text" id="shopping-input" placeholder="사야 할 물품 또는 준비물 입력" class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <button onclick="addShoppingItem()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-emerald-700">추가</button>
                </div>
                <ul id="shopping-list" class="space-y-2">
                    <!-- 쇼핑 체크리스트 출력 -->
                </ul>
            </div>

            <!-- 외부 쇼핑몰 가격 비교 연동 -->
            <div class="bg-white p-4 rounded-xl shadow-sm">
                <h3 class="font-bold text-md mb-2 text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-magnifying-glass-dollar text-amber-500"></i> 최저가 검색 비교
                </h3>
                <p class="text-xs text-gray-500 mb-3">필요한 물품의 이름을 검색하여 가격을 비교해보세요.</p>
                <div class="flex gap-2 mb-3">
                    <input type="text" id="price-search-input" placeholder="검색할 상품명 (예: 여권지갑)" class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                    <button onclick="searchPrice()" class="bg-amber-500 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-amber-600">검색</button>
                </div>
                <div id="search-links" class="hidden grid grid-cols-2 gap-2 pt-2">
                    <a id="link-naver" target="_blank" class="flex items-center justify-center gap-2 bg-green-100 text-green-700 p-2 rounded-lg text-xs font-bold hover:bg-green-200">
                        네이버 쇼핑 <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </a>
                    <a id="link-coupang" target="_blank" class="flex items-center justify-center gap-2 bg-red-100 text-red-700 p-2 rounded-lg text-xs font-bold hover:bg-red-200">
                        쿠팡 검색 <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </a>
                    <a id="link-danawa" target="_blank" class="flex items-center justify-center gap-2 bg-blue-100 text-blue-700 p-2 rounded-lg text-xs font-bold hover:bg-blue-200">
                        다나와 검색 <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </a>
                    <a id="link-google" target="_blank" class="flex items-center justify-center gap-2 bg-gray-100 text-gray-700 p-2 rounded-lg text-xs font-bold hover:bg-gray-200">
                        구글 쇼핑 <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </a>
                </div>
            </div>
        </section>

        <!-- 탭 3: 가계부 / 예산 -->
        <section id="tab-budget" class="tab-content hidden space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm">
                <h2 class="font-bold text-lg mb-3 text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-wallet text-purple-500"></i> 여행 예산 관리
                </h2>
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <input type="text" id="expense-title" placeholder="항목 (예: 저녁식사)" class="border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <input type="number" id="expense-amount" placeholder="금액 (원)" class="border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                <button onclick="addExpense()" class="w-full bg-purple-600 text-white py-2 rounded-lg text-sm font-semibold hover:bg-purple-700 mb-3">지출 추가</button>
                <div class="border-t pt-3 flex justify-between items-center font-bold text-sm text-gray-700">
                    <span>총 지출 금액:</span>
                    <span id="total-expense" class="text-purple-600 text-base">0 원</span>
                </div>
                <ul id="expense-list" class="space-y-2 mt-3">
                    <!-- 지출 목록 출력 -->
                </ul>
            </div>
        </section>

    </main>

    <!-- 하단 탭 네비게이션 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg z-50">
        <div class="max-w-md mx-auto flex justify-around">
            <button onclick="switchTab('itinerary')" id="nav-itinerary" class="flex-1 py-3 text-center flex flex-col items-center gap-1 active-tab">
                <i class="fa-solid fa-map-location-dot text-lg"></i>
                <span class="text-xs">일정</span>
            </button>
            <button onclick="switchTab('shopping')" id="nav-shopping" class="flex-1 py-3 text-center flex flex-col items-center gap-1 text-gray-500">
                <i class="fa-solid fa-bag-shopping text-lg"></i>
                <span class="text-xs">쇼핑/준비물</span>
            </button>
            <button onclick="switchTab('budget')" id="nav-budget" class="flex-1 py-3 text-center flex flex-col items-center gap-1 text-gray-500">
                <i class="fa-solid fa-coins text-lg"></i>
                <span class="text-xs">가계부</span>
            </button>
        </div>
    </nav>

    <script>
        // 현재 날짜 표시
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', weekday: 'short' });

        // 데이터 저장소 (LocalStorage 연동)
        let itineraries = JSON.parse(localStorage.getItem('itineraries')) || [];
        let shoppingItems = JSON.parse(localStorage.getItem('shoppingItems')) || [];
        let expenses = JSON.parse(localStorage.getItem('expenses')) || [];

        // 탭 전환 기능
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(el => {
                el.classList.remove('active-tab');
                el.classList.add('text-gray-500');
            });

            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            const activeNav = document.getElementById(`nav-${tabName}`);
            activeNav.classList.add('active-tab');
            activeNav.classList.remove('text-gray-500');
        }

        // --- 일정 기능 ---
        function renderItinerary() {
            const list = document.getElementById('itinerary-list');
            list.innerHTML = itineraries.length === 0 ? '<li class="text-xs text-gray-400 text-center py-2">등록된 일정이 없습니다.</li>' : '';
            itineraries.forEach((item, index) => {
                list.innerHTML += `
                    <li class="flex justify-between items-center bg-gray-50 p-2 rounded text-sm">
                        <span>${item}</span>
                        <button onclick="deleteItinerary(${index})" class="text-red-400 hover:text-red-600 text-xs"><i class="fa-solid fa-trash"></i></button>
                    </li>
                `;
            });
            localStorage.setItem('itineraries', JSON.stringify(itineraries));
        }

        function addItinerary() {
            const input = document.getElementById('itinerary-input');
            if (input.value.trim()) {
                itineraries.push(input.value.trim());
                input.value = '';
                renderItinerary();
            }
        }

        function deleteItinerary(index) {
            itineraries.splice(index, 1);
            renderItinerary();
        }

        // --- 쇼핑 & 준비물 기능 ---
        function renderShopping() {
            const list = document.getElementById('shopping-list');
            const stats = document.getElementById('shopping-stats');
            list.innerHTML = shoppingItems.length === 0 ? '<li class="text-xs text-gray-400 text-center py-2">체크리스트가 비어있습니다.</li>' : '';
            
            let completedCount = 0;
            shoppingItems.forEach((item, index) => {
                if (item.checked) completedCount++;
                list.innerHTML += `
                    <li class="flex justify-between items-center bg-gray-50 p-2 rounded text-sm">
                        <label class="flex items-center gap-2 cursor-pointer flex-1 ${item.checked ? 'line-through text-gray-400' : ''}">
                            <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleShopping(${index})" class="rounded text-emerald-600">
                            <span>${item.text}</span>
                        </label>
                        <button onclick="deleteShopping(${index})" class="text-red-400 hover:text-red-600 text-xs"><i class="fa-solid fa-trash"></i></button>
                    </li>
                `;
            });
            stats.innerText = `${completedCount}/${shoppingItems.length} 완료`;
            localStorage.setItem('shoppingItems', JSON.stringify(shoppingItems));
        }

        function addShoppingItem() {
            const input = document.getElementById('shopping-input');
            if (input.value.trim()) {
                shoppingItems.push({ text: input.value.trim(), checked: false });
                input.value = '';
                renderShopping();
            }
        }

        function toggleShopping(index) {
            shoppingItems[index].checked = !shoppingItems[index].checked;
            renderShopping();
        }

        function deleteShopping(index) {
            shoppingItems.splice(index, 1);
            renderShopping();
        }

        // 최저가 검색 연동
        function searchPrice() {
            const query = document.getElementById('price-search-input').value.trim();
            if (!query) return alert('검색어를 입력해주세요.');

            const encoded = encodeURIComponent(query);
            document.getElementById('link-naver').href = `https://search.shopping.naver.com/search/all?query=${encoded}`;
            document.getElementById('link-coupang').href = `https://www.coupang.com/np/search?component=&q=${encoded}`;
            document.getElementById('link-danawa').href = `https://search.danawa.com/dsearch.php?k1=${encoded}`;
            document.getElementById('link-google').href = `https://www.google.com/search?tbm=shop&q=${encoded}`;

            document.getElementById('search-links').classList.remove('hidden');
        }

        // --- 가계부 기능 ---
        function renderExpenses() {
            const list = document.getElementById('expense-list');
            const totalEl = document.getElementById('total-expense');
            list.innerHTML = expenses.length === 0 ? '<li class="text-xs text-gray-400 text-center py-2">지출 내역이 없습니다.</li>' : '';
            
            let total = 0;
            expenses.forEach((item, index) => {
                total += item.amount;
                list.innerHTML += `
                    <li class="flex justify-between items-center bg-gray-50 p-2 rounded text-sm">
                        <span>${item.title}</span>
                        <div class="flex items-center gap-2">
                            <span class="font-semibold">${item.amount.toLocaleString()}원</span>
                            <button onclick="deleteExpense(${index})" class="text-red-400 hover:text-red-600 text-xs"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </li>
                `;
            });
            totalEl.innerText = `${total.toLocaleString()} 원`;
            localStorage.setItem('expenses', JSON.stringify(expenses));
        }

        function addExpense() {
            const titleInput = document.getElementById('expense-title');
            const amountInput = document.getElementById('expense-amount');
            const title = titleInput.value.trim();
            const amount = parseInt(amountInput.value);

            if (title && !isNaN(amount)) {
                expenses.push({ title, amount });
                titleInput.value = '';
                amountInput.value = '';
                renderExpenses();
            }
        }

        function deleteExpense(index) {
            expenses.splice(index, 1);
            renderExpenses();
        }

        // 초기화 실행
        renderItinerary();
        renderShopping();
        renderExpenses();
    </script>
</body>
</html>
