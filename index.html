<style>
html{color-scheme:light dark;background:var(--bg)}
:root{--bg:#f6f7f9;--card:#ffffff;--card2:#f3f5f9;--text:#1d2330;--sub:#6b7385;--line:#e4e8ef;--accent:#2f6bff;--accent2:#e8f0ff;--hl:#fff4cc;--hlb:#f2b200;--danger:#e5484d;--glass:rgba(255,255,255,.82);--ov1:rgba(255,255,255,.35);--ov2:rgba(246,247,249,.9);--shadow:0 2px 12px rgba(20,30,60,.08)}
[data-theme=dark]{--bg:#0e1117;--card:#171b24;--card2:#1e2330;--text:#eef1f7;--sub:#9aa3b5;--line:#2a3140;--accent:#6c98ff;--accent2:#1f2b48;--hl:#3b3314;--hlb:#f5c542;--danger:#ff6b70;--glass:rgba(20,24,32,.84);--ov1:rgba(10,12,18,.45);--ov2:rgba(14,17,23,.92);--shadow:0 2px 12px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px}
#bg{position:fixed;inset:0;z-index:-2;background:linear-gradient(135deg,#dbe6ff,#f4f7fb) center/cover no-repeat;transition:opacity .6s}
#bgov{position:fixed;inset:0;z-index:-1;background:linear-gradient(var(--ov1),var(--ov2) 280px,var(--ov2))}
#app{max-width:480px;margin:0 auto;min-height:100dvh;padding:0 14px calc(90px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;margin:0 -14px 12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:8px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header.top h1{flex:1;margin:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:0;background:var(--card2);color:var(--text);width:36px;height:36px;border-radius:50%;font-size:17px;cursor:pointer}
.btn{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--accent2);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger)}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn.xs{padding:4px 10px;font-size:12px;font-weight:600;border-radius:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
h2{font-size:16px;margin:0 0 10px}
label.f{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;outline:none;min-width:0}
input:focus,select:focus{border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row>*{flex:1}.row>.fix{flex:none}
.muted{color:var(--sub);font-size:12px}
.hero{padding:18px 4px 8px}.hero h2{font-size:24px;margin:0 0 4px;text-shadow:0 1px 8px var(--bg)}
.trip{display:flex;gap:12px;align-items:center;cursor:pointer;padding:0;overflow:hidden}
.trip .th{position:relative;width:clamp(112px,36%,160px);min-height:136px;align-self:stretch;background:var(--accent2) center/cover;flex:none;display:flex;align-items:center;justify-content:center;font-size:34px}
.trip .tb{padding:12px 12px 12px 0;flex:1;min-width:0}
.trip b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trip{position:relative}
.badge.tr{position:absolute;top:10px;right:12px;margin:0;z-index:1}
.trip .tt{display:block;padding-right:58px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent2);color:var(--accent);margin-left:6px}
.ptabs{position:sticky;top:calc(57px + env(safe-area-inset-top));z-index:15;background:var(--bg);margin:0 -14px;padding:8px 14px 0}
#totop{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:40;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--text);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s}
#totop.on{opacity:1;pointer-events:auto;transform:none}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs.fit .tab{flex:1 1 0;min-width:0;padding-left:4px;padding-right:4px}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:8px 12px;font-size:13px;cursor:pointer;text-align:center;line-height:1.3}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab small{display:block;opacity:.75;font-size:11px}
.item{position:relative}
.card.item{padding:0;overflow:hidden;margin-bottom:8px;scroll-margin-top:68px}
.ih{display:flex;align-items:center;gap:4px;padding:7px 8px 7px 14px;background:var(--card2);border-bottom:1px solid var(--line)}

.ih .sp{flex:1}
.mini{border:0;background:none;color:var(--sub);width:30px;height:30px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}

.mini.del{opacity:.55}.mini.del:active{color:var(--danger);opacity:1}
.ibody{padding:16px 14px;display:flex;flex-direction:column;gap:8px}
.ibody input.pl{font-size:15px;font-weight:600}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.fld{min-width:0}
.fld>span{display:block;font-size:10.5px;font-weight:600;color:var(--sub);margin-bottom:3px}
.inl{display:flex;gap:6px;align-items:center}
.inl small{color:var(--sub);font-size:12px;flex:none}
.inl select{width:auto;flex:none}
.inl .n{width:54px;max-width:none;flex:none}
.inl .pinbtn{flex:none}

.pinst:empty{display:none}
.pinst{margin-top:6px}
.ctl{display:flex;gap:6px;justify-content:flex-end;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.pinst{font-size:12px;color:var(--sub);margin-top:6px;word-break:break-all}
.n{max-width:74px;flex:none}
iframe.map{width:100%;height:320px;border:0;border-radius:14px;background:var(--card2)}
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bot div{display:flex;width:100%;max-width:480px}
nav.bot button{flex:1;border:0;background:none;color:var(--sub);padding:10px 0 12px;font-size:12px;cursor:pointer}
nav.bot button b{display:block;font-size:20px;font-weight:400}
nav.bot button.on{color:var(--accent);font-weight:700}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.ev{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:10px}
.ev:before{content:"";position:absolute;left:-22px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--card)}
.ev.hl{background:var(--card);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ev.hl:before{background:var(--accent);width:14px;height:14px;left:-24px;top:14px;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent),0 0 12px var(--accent)}
.ev .t{font-weight:700;font-size:13px;color:var(--accent)}
.ev .p{font-size:16px;font-weight:600;margin:2px 0}
.nowtag{background:var(--accent);color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;margin-left:6px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:0}.kv span:first-child{color:var(--sub)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;max-width:90vw}
#toast.on{opacity:.95}
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45)}
#modal.on{display:flex}
#expfull{position:fixed;inset:0;z-index:55;display:none;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
#expfull.on{display:block}
#expfull .xin{max-width:480px;margin:0 auto;padding:0 14px 40px}
#expfull .xin header.top{position:sticky;top:0;margin:0 -14px 0}
.exd2{padding:12px 22px 14px;margin-bottom:16px}
.exd2 .exh b small{margin-left:8px;color:var(--sub);font-weight:500;font-size:12px}
.xtabs{position:sticky;top:57px;z-index:15;background:var(--bg);padding:8px 0 2px}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:6px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.fchip span{margin-left:6px;color:var(--sub);font-size:11.5px}

.fchip.on span{color:rgba(255,255,255,.85)}
.xcard{padding:20px 22px}
.exd2 .exh b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.exd2 .exh{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 14px}
.exd2 .exh span{white-space:nowrap;flex:none;margin-left:10px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.exd2 .exh+.exr{border-top:1px solid var(--line)}
#modal .sheet{background:var(--card);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.credit{font-size:10px;color:var(--sub);text-align:center;margin-top:18px;opacity:.8}
.credit a{color:inherit}
details summary{cursor:pointer;font-weight:600;padding:4px 0}
.trash{border:0;background:none;color:var(--sub);opacity:.5;width:36px;height:34px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.trash:hover,.trash:active{opacity:.9;color:var(--danger);background:var(--card2)}
.pinbtn{border:0;background:var(--accent2);color:var(--accent);width:34px;height:34px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pinbtn.on{background:var(--accent);color:#fff}
.phero{position:relative;margin:-12px -14px 0;min-height:290px;background:linear-gradient(135deg,#15171c,#4b505b) center/cover no-repeat;display:flex;align-items:center;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 78px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 78px),transparent)}
.pov{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,12,24,.82),rgba(8,12,24,.2) 62%,rgba(8,12,24,.1))}
.pin{position:relative;width:100%;color:#fff;text-align:center}
.pchips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pchip{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pin h2{font-size:28px;line-height:1.2;margin:10px 0 6px;color:#fff;text-shadow:none;text-wrap:balance;word-break:keep-all}
.pdate{font-size:13px;opacity:.92;font-variant-numeric:tabular-nums}
.pcard{position:relative;margin:-26px 0 14px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.pstats{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.wxa+.pstats{border-top:1px solid var(--line)}
.pstats>div{display:flex;flex-direction:column;justify-content:center;padding:12px 6px;text-align:center;border-right:1px solid var(--line);min-width:0}
.pstats>div:last-child{border-right:0}
.wx{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:0 0 14px;box-shadow:var(--shadow)}
.wx .wi{font-size:34px;line-height:1;flex:none}
.wx .wt{flex:1;min-width:0}
.wx .wt b{font-size:22px;font-variant-numeric:tabular-nums}
.wx .wt span{margin-left:8px;font-size:13.5px;font-weight:600}
.wx .wt small{display:block;color:var(--sub);font-size:12px;margin-top:3px;line-height:1.5}
.ctags{display:flex;flex-wrap:wrap;gap:6px}
.ctag{display:inline-flex;align-items:center;gap:2px;background:var(--accent2);color:var(--accent);font-weight:600;font-size:13.5px;border-radius:99px;padding:5px 6px 5px 12px}
.ctag button{border:0;background:none;color:inherit;opacity:.6;font-size:16px;line-height:1;width:22px;height:22px;cursor:pointer}
.csug{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.csug button{border:1px dashed var(--line);background:none;color:var(--sub);font-size:12.5px;border-radius:99px;padding:4px 10px;cursor:pointer}
.wxa{padding:12px 14px 2px}
.wxa .top{display:flex;align-items:center;gap:12px;cursor:pointer}

.wxa .top .r b{font-size:13.5px}
.wxa .top .r span{color:var(--sub)}
.wxa .top .g{margin-left:auto;color:var(--sub);font-size:18px}
.wxa .pl{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 0 12px}
.wxa .pl::-webkit-scrollbar{display:none}
.wxa .pl button{flex:none;border:0;font:inherit;font-size:12px;background:var(--card2);color:var(--text);border-radius:99px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.wxa .pl button.on{background:var(--accent2);color:var(--accent);font-weight:700}
.lo,.dsum .dm .lo{color:#2f6bff}.hi,.dsum .dm .hi{color:#e05a2a}
#wxfull{position:fixed;inset:0;z-index:55;display:none;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
#wxfull.on{display:block}

.wxl{padding:14px 0 10px}

.wxl .wh b{font-size:16px;margin-right:auto}
.wxl .wh span{font-size:14px;font-weight:700}
.wxl .wh .sub{font-weight:500;font-size:12.5px}
.tz{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 12px 2px}

.tz b{display:block;font-size:15px;color:var(--text);margin:1px 0}
.tz .o{display:block;font-size:19px;margin:3px 0}
.tz small{display:block;color:var(--text);font-size:11px;font-weight:600;line-height:1.35}
.chk{display:flex;gap:6px;padding:8px 16px 0;flex-wrap:wrap}
.chk span{font-size:11.5px;border:1px dashed var(--line);border-radius:99px;padding:3px 9px;color:var(--sub)}
.chk span.y{border:1px solid var(--accent);background:var(--accent2);color:var(--accent);font-weight:700}
.hs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 12px;border-top:1px solid var(--line);padding-top:10px}
.hs::-webkit-scrollbar{display:none}
.hc{flex:none;width:52px;text-align:center;padding:8px 0;border-radius:12px;font-variant-numeric:tabular-nums}

.hc b{display:block;font-size:14px}
.hc small{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.hc.now{background:var(--accent2)}.hc.now .t{color:var(--accent);font-weight:700}
.wx.mut{color:var(--sub);font-size:13px;justify-content:center}
.pstats b{display:block;font-size:16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pstats .est{font-size:10px;font-weight:500;color:var(--sub);opacity:.75;margin-left:3px;vertical-align:middle}

.dsum span{font-size:14px;color:var(--sub)}

.imgs{display:flex;gap:8px;flex-wrap:wrap}

.pinrow+.pinrow{margin-top:8px}
.mlink{color:var(--accent);text-decoration:underline;text-underline-offset:2px;word-break:break-all}
.plabel{flex:0 0 42%;min-width:0;width:42%}
.pcnt{position:absolute;top:-4px;right:-4px;min-width:15px;height:15px;border-radius:8px;background:var(--accent);color:#fff;font:700 10px/15px system-ui;font-style:normal;text-align:center;padding:0 3px;box-sizing:border-box}

/* ---------- 상태 ---------- */
let S={store:{trips:[]},tripId:null,screen:'list',day:0,pday:0,view:false,viewTrip:null,mmode:'d',bgKey:null};

/* 저장소: 브라우저 용량이 훨씬 큰 IndexedDB 사용 (localStorage는 약 5MB 제한). 사용할 수 없으면 localStorage로 대체 */
let IDBP=null;
function idbOpen(){return IDBP||(IDBP=new Promise((res,rej)=>{setTimeout(()=>rej(new Error('idb timeout')),3000);try{const r=indexedDB.open('travelplanner',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))}catch(e){rej(e)}}))}
const idbGet=k=>idbOpen().then(db=>new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}));
const idbSet=(k,v)=>idbOpen().then(db=>new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}));
async function saveStore(){
  try{await idbSet(KEY,S.store);try{localStorage.removeItem(KEY)}catch(e){}return}catch(e){}
  try{localStorage.setItem(KEY,JSON.stringify(S.store))}catch(e){toast('저장 공간이 부족해요. 백업 후 정리해 주세요')}}
async function load(){let j=null;
  try{j=await idbGet(KEY)}catch(e){}
  if(!(j&&j.trips)){j=null;try{const l=JSON.parse(localStorage.getItem(KEY));if(l&&l.trips)j=l}catch(e){}
    if(j){S.store=j;await saveStore()}}
  else S.store=j;
  try{localStorage.removeItem(KEY+'.bak')}catch(e){}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  lastSnap=snap()}
let lastSnap='';
const snap=()=>JSON.stringify(S.store.trips,(k,v)=>k==='img'?undefined:v);
let pt=null;
function persist(now){if(S.view)return;clearTimeout(pt);const f=()=>{const sn=snap();if(sn!==lastSnap){lastSnap=sn;S.store.updatedAt=Date.now();cloudSchedule()}saveStore();scheduleSync()};now?f():pt=setTimeout(f,300)}

/* ---------- 날짜/금액 ---------- */
const WD=['일','월','화','수','목','금','토'];

function parseD(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function dayCount(t){const n=Math.round((parseD(t.end)-parseD(t.start))/864e5)+1;return Math.max(1,Math.min(n||1,60))}
function dateOfDay(t,i){const d=parseD(t.start);d.setDate(d.getDate()+i);return d}
const dlabel=d=>(d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')';
function itemsOf(t,i){return (t.items[i]=t.items[i]||[])}
const hm=s=>{if(!s)return null;const [h,m]=String(s).split(':').map(Number);return isFinite(h)&&isFinite(m)?h*60+m:null};
const fmtHM=x=>String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');
function durMin(it){const s=hm(it.time),e=hm(it.end);
  if(s!=null&&e!=null){let d=e-s;if(d<=0)d+=1440;return d}
  return (+it.hh||0)*60+(+it.mm||0)}
function durTxt(m){if(!m)return'';const h=Math.floor(m/60),r=m%60;return (h?h+'시간':'')+(r?(h?' ':'')+r+'분':'')}
const timeTxt=it=>it.time?(it.end?it.time+' – '+it.end:it.time):'--:--';
function krwPer(code){if(code==='KRW')return 1;if(RATES&&RATES[code])return 1/RATES[code];return FALLBACK[code]||1}
const subSum=it=>(it.sub||[]).reduce((s,x)=>s+(+x.amt||0),0);
const itemTotal=it=>(+it.amount||0)+subSum(it);
const unitOf=(t,it)=>(it.cur==='KRW'||t.currency==='KRW')?'원':t.currency;
function toKRW(t,it){const a=itemTotal(it);return it.cur==='LOCAL'&&t.currency!=='KRW'?a*t.rate:a}
function dayTotal(t,i){return itemsOf(t,i).reduce((s,it)=>s+toKRW(t,it),0)}
function totalAll(t){let s=0;for(let i=0;i<dayCount(t);i++)s+=dayTotal(t,i);return s}
const moneyTxt=(t,k)=>t.currency!=='KRW'&&t.rate?`₩${fmt(k)} <span class="muted">(≈ ${fmt(k/t.rate)} ${t.currency})</span>`:`₩${fmt(k)}`;
async function fetchRates(force){
  try{const c=JSON.parse(localStorage.getItem('tp.rates')||'null');
    if(c&&!force&&Date.now()-c.t<6*3600e3){RATES=c.r;RATE_TIME=c.t;RATE_LIVE=true;return}}catch(e){}
  try{const r=await fetch('https://open.er-api.com/v6/latest/KRW');const j=await r.json();
    if(j.result==='success'){RATES=j.rates;RATE_TIME=Date.now();RATE_LIVE=true;localStorage.setItem('tp.rates',JSON.stringify({t:RATE_TIME,r:RATES}))}}catch(e){}
}

/* ---------- 배경 이미지 (Wikimedia Commons) ---------- */
async function commons(q){
  const ck='tp.img1:'+q;
  try{const c=JSON.parse(localStorage.getItem(ck)||'null');if(c&&Date.now()-c.t<7*864e5&&c.l.length)return c.l}catch(e){}
  const u='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=40&prop=imageinfo&iiprop=url|size&iiurlwidth=1400&gsrsearch='+encodeURIComponent(q);
  try{const j=await (await fetch(u)).json();const pages=Object.values(j.query?.pages||{});
    const l=pages.filter(p=>{const i=p.imageinfo?.[0];return i&&i.thumburl&&/\.jpe?g$/i.test(p.title)&&i.width>=1600&&i.width>i.height*1.2&&!/map|flag|logo|coat|locator|diagram|plan|stamp|icon|poster|scan|book|text/i.test(p.title)})
      .map(p=>({url:p.imageinfo[0].thumburl,title:p.title.replace(/^File:/,''),page:p.imageinfo[0].descriptionurl})).slice(0,25);
    if(l.length)try{localStorage.setItem(ck,JSON.stringify({t:Date.now(),l}))}catch(e){}
    return l}catch(e){return[]}
}
async function wiki(q){try{const j=await (await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(q))).json();
  const s=j.originalimage?.source||j.thumbnail?.source;return s?[{url:s,title:j.title,page:j.content_urls?.desktop?.page}]:[]}catch(e){return[]}}
async function findImages(qs){for(const q of qs){const l=await commons(q);if(l.length)return l}
  for(const q of qs.slice(-2)){const l=await wiki(q);if(l.length)return l}return[]}
async function loadBg(qs,key,t){
  if(t&&t.thumb){S.bgKey=key;S.bgUrl=t.thumb;S.credit=null;const b=$('#bg');if(b){b.style.backgroundImage='url("'+cssUrl(t.thumb)+'")';b.style.opacity=1}const hh=$('#heroimg');if(hh)hh.style.backgroundImage='url("'+cssUrl(t.thumb)+'")';const c=$('#credit');if(c)c.innerHTML=creditHtml();return}
  S.bgKey=key;S.bgUrl=null;const imgs=await findImages(qs);if(S.bgKey!==key||!imgs.length)return;
  if(PICK[key]==null)PICK[key]=Math.random();
  const im=imgs[Math.floor(PICK[key]*imgs.length)];
  const pre=new Image();pre.onload=()=>{if(S.bgKey!==key)return;const b=$('#bg');b.style.opacity=0;setTimeout(()=>{b.style.backgroundImage=`url("${im.url}")`;b.style.opacity=1},200);
    if(t&&!S.view){t.img=im.url;persist()}
    S.credit=im;S.bgUrl=im.url;const hh=$('#heroimg');if(hh)hh.style.backgroundImage='url("'+cssUrl(im.url)+'")';const c=$('#credit');if(c)c.innerHTML=creditHtml()};
  pre.src=im.url;
}
const creditHtml=()=>S.credit?`사진: <a href="${esc(S.credit.page||'#')}" target="_blank" rel="noopener">${esc(S.credit.title)}</a> · Wikimedia Commons`:'';
function placeQueries(t){

const MAXIMG=3;
const okImg=x=>typeof x==='string'&&x.length<500000&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(x);
function pickImg(id){const f=findItem(id);if(!f)return;if((f.it.imgs||[]).length>=MAXIMG){toast('이미지는 일정당 '+MAXIMG+'장까지 넣을 수 있어요');return}S.imgTarget=id;$('#imfile').click()}
function shrinkImg(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{const max=640,k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.72))};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};im.src=url})}
async function addImgFiles(id,files){files=[...files].filter(f=>/^image\//.test(f.type));
  const f=findItem(id);if(!f||!files.length)return false;f.it.imgs=f.it.imgs||[];
  if(f.it.imgs.length>=MAXIMG){toast('이미지는 일정당 '+MAXIMG+'장까지 넣을 수 있어요');return false}
  let added=0;for(const file of files){if(f.it.imgs.length>=MAXIMG)break;try{f.it.imgs.push(await shrinkImg(file));added++}catch(e){}}
  if(!added){toast('이미지를 불러오지 못했어요');return false}
  persist(true);render();toast(added+'장 추가했어요 ✓'+(files.length>added?' (최대 '+MAXIMG+'장)':''));return true}
async function onItemImgs(inp){const id=S.imgTarget;const files=[...inp.files];inp.value='';await addImgFiles(id,files)}

    c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);

function parseSrc(x){const m=/^([A-Za-z0-9_.-]{1,100})\/([A-Za-z0-9_.-]{1,100})\/([A-Za-z0-9-]{8,64})$/.exec(x||'');return m?{o:m[1],r:m[2],id:m[3]}:null}
const ghUrl=src=>GHAPI+src.o+'/'+src.r+'/contents/'+(src.path||'shared/'+src.id+'.json');
/* 받는 사람: 토큰 없이 읽기. no-cache = 매번 ETag로 확인 (변경 없으면 304, 호출 한도 소모 없음) */
async function ghGet(src){
  try{const r=await fetch(ghUrl(src),{headers:{'Accept':'application/vnd.github.raw+json'},cache:'no-cache'});
    if(r.ok)return await r.json();
    if(r.status===404)throw new Error('gh get 404')}catch(e){if(/404/.test(e.message))throw e}
  /* API 호출 한도 초과(403/429) 등: raw 주소로 대체 (몇 분 정도 늦게 반영될 수 있음) */
  const r2=await fetch('https://raw.githubusercontent.com/'+src.o+'/'+src.r+'/HEAD/shared/'+src.id+'.json?t='+Math.floor(Date.now()/60000),{cache:'no-cache'});
  if(!r2.ok)throw new Error('gh raw '+r2.status);return r2.json()}
const sharedGet=x=>{const g=parseSrc(x);return g?ghGet(g):blobGet(x)};
const b64=str=>{let x='';new TextEncoder().encode(str).forEach(c=>x+=String.fromCharCode(c));return btoa(x)};
const shaCache={};let ghChain=Promise.resolve();
const ghAuth=g=>({'Accept':'application/vnd.github+json','Authorization':'Bearer '+g.token});
async function ghFetchSha(src,g){const r=await fetch(ghUrl(src)+'?t='+Date.now(),{headers:ghAuth(g),cache:'no-store'});
  if(r.status===404)return undefined;if(!r.ok)throw new Error('sha '+r.status);return (await r.json()).sha}
async function ghPutNow(src,obj){const g=gh();if(!g)throw new Error('no token');
  const content=b64(JSON.stringify(obj));
  for(let k=0;k<2;k++){
    let sha=shaCache[src.path||src.id];if(!sha||k)sha=await ghFetchSha(src,g);
    const r=await fetch(ghUrl(src),{method:'PUT',headers:{...ghAuth(g),'Content-Type':'application/json'},body:JSON.stringify(Object.assign({message:'update shared trip',content},sha?{sha}:{}))});
    if(r.ok){shaCache[src.path||src.id]=(await r.json()).content.sha;return}
    if(r.status!==409&&r.status!==422)throw new Error('put '+r.status);
    delete shaCache[src.path||src.id]}
  throw new Error('conflict')}
const ghPut=(src,obj)=>(ghChain=ghChain.catch(()=>{}).then(()=>ghPutNow(src,obj)));
async function ghDel(src){const g=gh();if(!g)return false;
  try{const sha=await ghFetchSha(src,g);if(!sha)return true;
    const r=await fetch(ghUrl(src),{method:'DELETE',headers:{...ghAuth(g),'Content-Type':'application/json'},body:JSON.stringify({message:'remove shared trip',sha})});
    delete shaCache[src.path||src.id];return r.ok}catch(e){return false}}
const newShareId=()=>Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>'abcdefghjkmnpqrstuvwxyz23456789'[b%31]).join('');

  openModal(`<h2>🔗 GitHub 연결</h2>
  <p class="muted" style="margin-top:0">① <b>모든 일정을 클라우드에 자동 저장</b>해서 다른 기기·브라우저에서도 같은 내용이 열려요 (data/store.json). ② 공유 링크는 고정 주소로 만들어져요 (shared/ 폴더).</p>
  <label class="muted">GitHub 아이디</label><input id="ghO" value="${esc(g.owner||'')}" autocapitalize="off" autocorrect="off" placeholder="예: hongildong">

function saveGh(){const o=$('#ghO').value.trim(),r=$('#ghR').value.trim().replace(/\.git$/,''),t=$('#ghT').value.trim(),sy=($('#ghS').value||'').trim().replace(/\.git$/,'');if(sy&&!SYNCRE.test(sy)){toast('저장소는 아이디/저장소 형식으로 입력하세요');return}
  if(!GHN.test(o)||!GHN.test(r)||!t){toast('아이디, 저장소, 토큰을 모두 입력하세요');return}
  try{localStorage.setItem(GHK,JSON.stringify({owner:o,repo:r,token:t,syncRepo:sy}))}catch(e){toast('저장하지 못했어요');return}
  closeModal();toast('연결했어요. 동기화를 시작합니다…');cloudSync(true)}
function clearGh(){try{localStorage.removeItem(GHK)}catch(e){}closeModal();toast('설정을 해제했어요')}

/* ---------- 내 모든 일정 클라우드(GitHub) 동기화 ---------- */
function ghHint(e){const m=String((e&&e.message)||e||'');const c=(m.match(/\b(\d{3})\b/)||[])[1];
  if(/no token|no cfg/.test(m))return 'GitHub 연결 정보가 없어요';
  if(c==='401')return '토큰이 올바르지 않거나 만료됐어요 (401)';
  if(c==='403')return '토큰에 쓰기 권한이 없거나 GitHub 호출 한도를 넘었어요 (403)';
  if(c==='404')return '저장소를 찾지 못했거나 토큰에 그 저장소 권한(Contents 읽기/쓰기)이 없어요 (404)';
  if(c==='413'||c==='422')return '저장할 데이터가 너무 크거나 형식이 맞지 않아요 ('+c+')';
  if(/conflict/.test(m))return '다른 기기에서 동시에 저장해서 충돌했어요. 잠시 뒤 다시 시도하세요';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return '네트워크가 끊겼거나 보안 설정이 연결을 막았어요';
  return '알 수 없는 오류: '+m.slice(0,60)}
const SYNCRE=/^([A-Za-z0-9_.-]{1,100})\/([A-Za-z0-9_.-]{1,100})$/;
function cloudSrc(){const g=gh();if(!g)return null;const m=SYNCRE.exec((g.syncRepo||'').trim());return {o:m?m[1]:g.owner,r:m?m[2]:g.repo,path:'data/store.json'}}
let cloudT=null,cloudBusy=false;
function cloudSchedule(){if(S.view||!gh())return;clearTimeout(cloudT);cloudT=setTimeout(()=>cloudPush().then(ok=>{if(!ok)toast('클라우드 저장 실패: '+S.cloudErr,5000)}),3000)}
function cloudPayload(){return {app:'travel-planner',v:1,updatedAt:S.store.updatedAt||Date.now(),trips:S.store.trips.map(t=>{const c=JSON.parse(JSON.stringify(t));delete c.img;return c})}}
async function cloudPush(){const src=cloudSrc();if(!src)return false;clearTimeout(cloudT);cloudT=null;
  try{if(!S.store.updatedAt)S.store.updatedAt=Date.now();await ghPut(src,cloudPayload());S.cloudAt=Date.now();S.cloudErr='';return true}catch(e){S.cloudErr=ghHint(e);return false}}
async function cloudPull(){const src=cloudSrc(),g=gh();if(!src||!g)throw new Error('no cfg');
  const r=await fetch(ghUrl(src)+'?t='+Date.now(),{headers:{'Accept':'application/vnd.github.raw+json','Authorization':'Bearer '+g.token},cache:'no-store'});
  if(r.status===404)return null;if(!r.ok)throw new Error('pull '+r.status);return r.json()}
function applyRemote(rem){
  idbSet(KEY+'.bak',S.store).catch(()=>{});
  S.store={trips:rem.trips.filter(t=>t&&typeof t==='object'&&t.id&&t.items&&t.start&&t.end),updatedAt:rem.updatedAt};
  saveStore();
  lastSnap=snap();
  if(S.tripId&&!S.store.trips.some(t=>t.id===S.tripId)){S.tripId=null;S.screen='list'}
  S.listKey=null;S.bgKey=null;render()}
async function cloudSync(manual){
  if(S.view||!gh()||cloudBusy)return;cloudBusy=true;
  try{
    if(cloudT){await cloudPush()}
    const rem=await cloudPull();const lu=S.store.updatedAt||0;
    if(rem&&Array.isArray(rem.trips)&&(+rem.updatedAt||0)>lu&&(S.store.trips.length===0||(+rem.updatedAt||0)>lu)){
      applyRemote(rem);S.cloudAt=Date.now();toast('다른 기기의 최신 일정을 불러왔어요 ✓')}
    else if(!rem||lu>(+rem.updatedAt||0)){
      if(!S.store.trips.length&&!rem){if(manual)toast('저장할 일정이 없어요')}
      else{const ok=await cloudPush();if(manual||!ok)toast(ok?'클라우드에 저장했어요 ✓':'클라우드 저장 실패: '+S.cloudErr,ok?1800:5000)}}
    else{S.cloudAt=Date.now();if(manual)toast('이미 최신이에요 ✓')}
  }catch(e){S.cloudErr=ghHint(e);if(manual)toast('동기화 실패: '+S.cloudErr,5000)}
  finally{cloudBusy=false}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!S.view&&gh()&&!cloudT)cloudSync(false)});

/* 받은 데이터는 신뢰하지 않고 필요한 값만 걸러서 사용 */
function cleanTrip(j){if(!j||typeof j!=='object')throw new Error('bad');
  const s=(v,max=300)=>String(v??'').slice(0,max);const num=v=>{v=+v;return isFinite(v)?v:0};
  const numOrBlank=v=>(v===''||v==null)?'':num(v);const tm=v=>/^\d{2}:\d{2}$/.test(v)?v:'';
  const dre=/^\d{4}-\d{2}-\d{2}$/;if(!dre.test(j.start)||!dre.test(j.end))throw new Error('bad date');
  const t={id:s(j.id,40),country:s(j.country,60),city:s(j.city,80),cities:Array.isArray(j.cities)?j.cities.slice(0,8).map(x=>s(x,40)).filter(Boolean):undefined,title:s(j.title,120),start:j.start,end:j.end,
    currency:/^[A-Z]{3}$/.test(j.currency)?j.currency:'KRW',rate:num(j.rate)||1,items:{}};
  if(BID.test(j.shareId||''))t.shareId=j.shareId;
  {const ex={};const arrOf=k=>Array.isArray(j.exp&&j.exp[k])?j.exp[k]:[];
    ['pre',...Array.from({length:dayCount(t)},(_,i)=>i)].forEach(k=>{ex[k]=arrOf(k).slice(0,200).filter(e=>e&&typeof e==='object').map(e=>({id:s(e.id,40)||uid(),cat:CATS.some(c=>c[0]===e.cat)?e.cat:'etc',amount:num(e.amount),cur:e.cur==='LOCAL'?'LOCAL':'KRW',memo:s(e.memo,60)}))});t.exp=ex}
  if(typeof j.thumb==='string'&&j.thumb.length<600000&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(j.thumb))t.thumb=j.thumb;
  const n=dayCount(t);
  for(let d=0;d<n;d++){const arr=Array.isArray(j.items&&j.items[d])?j.items[d]:[];
    t.items[d]=arr.slice(0,100).filter(it=>it&&typeof it==='object').map(it=>({
      id:s(it.id,40)||uid(),time:tm(it.time),end:tm(it.end),place:s(it.place,200),
      hh:numOrBlank(it.hh),mm:numOrBlank(it.mm),amount:numOrBlank(it.amount),cur:it.cur==='LOCAL'?'LOCAL':'KRW',
      memo:s(it.memo,2000),pinName:s(it.pinName,200),pinLabel:s(it.pinLabel,30),url:isGmap(it.url)?s(it.url,2000):'',
      lat:it.lat!=null&&isFinite(+it.lat)?+it.lat:null,lng:it.lng!=null&&isFinite(+it.lng)?+it.lng:null,
      more:(Array.isArray(it.more)?it.more:[]).slice(0,8).filter(x=>x&&typeof x==='object').map(x=>({id:s(x.id,40)||uid(),pinLabel:s(x.pinLabel,30),pinText:s(x.pinText,500),pinName:s(x.pinName,200),url:isGmap(x.url)?s(x.url,2000):'',lat:x.lat!=null&&isFinite(+x.lat)?+x.lat:null,lng:x.lng!=null&&isFinite(+x.lng)?+x.lng:null})),
      imgs:(Array.isArray(it.imgs)?it.imgs:[]).slice(0,3).filter(okImg),sub:(Array.isArray(it.sub)?it.sub:[]).slice(0,50).filter(x=>x&&typeof x==='object').map(x=>({id:s(x.id,20),name:s(x.name,100),amt:num(x.amt)}))}))}
  return t}

let syncT=null;
function scheduleSync(){if(S.view)return;const t=S.store.trips.find(x=>x.id===S.tripId);if(!t||!t.shareId)return;clearTimeout(syncT);const id=t.id;syncT=setTimeout(()=>syncShare(id).then(ok=>{if(!ok)toast('공유 링크에 반영하지 못했어요. 네트워크·토큰을 확인하세요')}),2500)}
async function syncShare(tid){const t=S.store.trips.find(x=>x.id===tid);if(!t||!t.shareId)return false;try{const g=parseSrc(t.shareId);if(g)await ghPut(g,pub(t,true));else await blobPut(t.shareId,pub(t));return true}catch(e){return false}}
async function pushNow(){const t=trip();toast('반영 중…');const ok=await syncShare(t.id);toast(ok?'공유 링크에 반영했어요 ✓':'반영하지 못했어요. 네트워크를 확인하세요')}
async function stopShare(){const t=trip();if(!t.shareId)return;
  if(!confirm('공유 링크를 끄면 받은 사람도 더 이상 일정을 볼 수 없어요. 끌까요?'))return;

  delete t.shareId;persist(true);closeModal();toast(ok?'공유를 중단했어요':'이 기기에서는 공유를 해제했어요 (서버 삭제는 실패)')}

/* 받는 사람 쪽: 불러오기 / 새로고침 */
async function loadShared(id){try{S.viewTrip=cleanTrip(await sharedGet(id));S.viewTrip.shareId=id;S.loadErr=false;return true}catch(e){S.loadErr=true;return false}}
async function refreshShared(){if(!S.shareId)return;toast('불러오는 중…');
  const before=JSON.stringify(S.viewTrip);const ok=await loadShared(S.shareId);
  if(S.viewTrip&&S.pday>=dayCount(S.viewTrip))S.pday=0;render();
  toast(!ok?'불러오지 못했어요. 네트워크를 확인하세요':JSON.stringify(S.viewTrip)===before?'이미 최신이에요':'최신 일정으로 갱신했어요')}
let sharedPollBusy=false;
async function pollShared(){
  if(sharedPollBusy||!S.view||!S.shareId||S.screen!=='preview'||document.hidden||document.querySelector('details[open]'))return;
  sharedPollBusy=true;
  try{
    const fresh=cleanTrip(await sharedGet(S.shareId));fresh.shareId=S.shareId;
    const before=JSON.stringify(S.viewTrip),after=JSON.stringify(fresh);
    if(before!==after){
      const y=scrollY;S.viewTrip=fresh;S.loadErr=false;
      if(S.pday>=dayCount(fresh))S.pday=0;
      render();scrollTo(0,y);
    }
  }catch(e){/* 자동 확인 실패는 화면을 방해하지 않고 다음 주기에 재시도 */}
  finally{sharedPollBusy=false}
}
async function retryShared(){S.loadErr=false;render();await loadShared(S.shareId);render()}

let ghWarn='';
async function makeShareUrl(t){ghWarn='';
  if(gh()||parseSrc(t.shareId)){
    try{const g=gh();let src=parseSrc(t.shareId);if(!src)src={o:g.owner,r:g.repo,id:newShareId()};
      await ghPut(src,pub(t,true));
      const key=src.o+'/'+src.r+'/'+src.id;if(t.shareId!==key){t.shareId=key;persist(true)}
      return baseUrl()+'#g='+key}
    catch(e){ghWarn='저장소에 올리지 못해 일회성 링크로 복사했어요 (설정·토큰 확인)'}}
  return baseUrl()+'#v='+await enc(pub(t))}
/* 링크만 복사: 만드는 데 시간이 걸려도 iOS 사파리에서 복사가 막히지 않도록 Promise 그대로 클립보드에 전달 */
async function copyText(textPromise){
  try{if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
    await navigator.clipboard.write([new ClipboardItem({'text/plain':Promise.resolve(textPromise).then(s=>new Blob([s],{type:'text/plain'}))})]);return true}}catch(e){}
  const s=await textPromise;
  try{await navigator.clipboard.writeText(s);return true}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=s;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,s.length);const ok=document.execCommand('copy');ta.remove();if(ok)return true}catch(e){}
  return s}
function showLinkModal(url){
  openModal(`<h2>링크 복사</h2><p class="muted" style="margin-top:0">자동 복사가 막혀 있어요. 아래 링크를 길게 눌러 복사하세요.</p><textarea id="lnk" readonly rows="4" onclick="this.select()">${esc(url)}</textarea><div style="height:8px"></div><button class="btn block" onclick="closeModal()">닫기</button>`);
  setTimeout(()=>{const e=$('#lnk');if(e){e.focus();e.select()}},50)}
async function shareLink(){const t=trip();
  let r;try{r=await copyText(makeShareUrl(t))}catch(e){toast('링크를 만들지 못했어요. 다시 시도해 주세요');return}
  if(r===true)toast(ghWarn||'링크를 복사했어요 ✓');else showLinkModal(r)}
async function shareFile(){const t=pub(null,true);closeModal();
  const json=JSON.stringify(t).replace(/</g,'\\u003c');
  const html=SRC.replace(/<script id="shared">[\s\S]*?<\/script>/,'').replace('<head>','<head><script id="shared">window.__SHARED__='+json+'<\/script>');
  const name=((t.title||'여행').replace(/[\\/:*?"<>|]/g,'')||'여행')+'_프리뷰.html';
  const file=new File([html],name,{type:'text/html'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:t.title});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();toast('프리뷰 파일을 저장했어요')}

  if(!S.view)h+=`<button class="btn block" onclick="shareLink()" style="margin-bottom:12px">📤 프리뷰 공유하기</button>`;
  else h+=`<div class="muted" style="text-align:center;margin-bottom:10px">공유된 프리뷰 화면입니다${S.shareId?' · 오른쪽 위 ↻ 로 최신 일정 확인':''}</div>`;
  h+=`<div class="ptabs">${dayTabs(t,S.pday,'selPDay')}</div>`;
  h+=`<div class="dsum"><div><b>${S.pday+1}일차</b><span>${dlabel(dateOfDay(t,S.pday))}</span></div><div class="dm">${moneyTxt(t,dayTotal(t,S.pday))}</div></div>`;
  if(!a.length)h+=`<div class="card muted" style="text-align:center;padding:26px">이 날은 등록된 일정이 없어요.</div>`;
  else{const ai=activeIdx(t,S.pday,a);h+='<div class="tl">';a.forEach((it,k)=>{
    const hl=k===ai,pl=pinListOf(it),hasPin=pl.length>0;
    const dur=durTxt(durMin(it)),unit=unitOf(t,it),tot=itemTotal(it);
    const subs=(it.sub||[]).filter(s=>s.name||+s.amt);
    const ss=subSum(it);
    const meta=(!ss&&tot>0)?`<div class="muted">💰 ${fmt2(tot)} ${unit}</div>`:'';
    const subHtml=subs.length?`<div class="subs">${ss&&+it.amount?`<div class="sr"><span>기본 금액</span><b>${fmt2(+it.amount)} ${unit}</b></div>`:''}${subs.map(s=>`<div class="sr"><span>${esc(s.name||'상세 일정')}</span>${+s.amt?`<b>${fmt2(+s.amt)} ${unit}</b>`:''}</div>`).join('')}${ss?`<div class="sr tot"><span>합계</span><b>${fmt2(tot)} ${unit}</b></div>`:''}</div>`:'';
    h+=`<div class="ev${hl?' hl':''}${hasPin?' hasp':''}" ${hl?'id="hlnow"':''}>${hasPin?(pl.length>1?`<button class="evpin" onclick="openPinPicker('${it.id}')" aria-label="핀 선택" title="핀 선택"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><i class="pcnt">${pl.length}</i></button>`:`<a class="evpin" href="${esc(googleMapHref(pl[0]))}" target="_blank" rel="noopener" aria-label="지도에서 위치 보기" title="지도에서 보기"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></a>`):''}<div class="t">${esc(timeTxt(it))}${dur?`<span class="dur">⏱ ${dur}</span>`:''}${hl?'<span class="nowtag">지금 진행</span>':''}</div>
    <div class="p">${esc(it.place||'(일정 미입력)')}</div>${meta}${it.memo?`<div class="memo">${linkify(it.memo)}</div>`:''}${(it.imgs&&it.imgs.length)?`<div class="evimgs n${it.imgs.length}">${it.imgs.filter(okImg).map(src=>`<img src="${src}" alt="" loading="lazy" onclick="zoomImg(this.src)">`).join('')}</div>`:''}${subHtml}</div>`});h+='</div>'}
  h+=`<details class="mapd" ontoggle="if(this.open)initPMap()"><summary>🗺️ ${S.pday+1}일차 핀 지도 보기</summary><div id="lmap" style="margin-top:8px"></div></details>`;
  return h+`<div class="credit" id="credit">${creditHtml()}</div>`}

/* 프리뷰 지도: 핀을 지정한 장소만 고정 마커로 표시 (Leaflet + OpenStreetMap) */
let LLP=null,PMAP=null;
function loadLeaflet(){if(window.L)return Promise.resolve(window.L);
  return LLP||(LLP=new Promise((res,rej)=>{
    const l=document.createElement('link');l.rel='stylesheet';l.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css';document.head.appendChild(l);
    const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js';
    s.onload=()=>res(window.L);s.onerror=()=>{LLP=null;rej(new Error('leaflet'))};document.head.appendChild(s)}))}
async function initPMap(){const el=$('#lmap');if(!el)return;const t=trip();
  const ps=pinsOf(t,S.pday);
  if(!ps.length){el.innerHTML='<div class="muted" style="padding:22px;text-align:center">이 날은 핀을 지정한 일정이 없어요.</div>';return}
  el.innerHTML='<div class="muted" style="padding:22px;text-align:center">지도를 불러오는 중…</div>';
  try{const L=await loadLeaflet();if($('#lmap')!==el)return;
    if(PMAP){try{PMAP.remove()}catch(e){}PMAP=null}
    el.innerHTML='';el.classList.add('on');
    const map=L.map(el,{scrollWheelZoom:false});PMAP=map;
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    const b=[];
    ps.forEach((it,i)=>{
      const ic=L.divIcon({className:'',html:`<div class="lpin"><span>${i+1}</span></div>`,iconSize:[30,30],iconAnchor:[15,36],popupAnchor:[0,-34]});
      const href=googleMapHref(it);
      L.marker([it.lat,it.lng],{icon:ic}).addTo(map).bindPopup(`<b>${esc(it.pinName||it.place||'핀')}</b><br>${esc(timeTxt(it))}<br><a href="${esc(href)}" target="_blank" rel="noopener">구글 지도에서 열기</a>`);
      b.push([it.lat,it.lng])});
    map.fitBounds(b,{padding:[34,34],maxZoom:16});setTimeout(()=>map.invalidateSize(),50)
  }catch(e){el.innerHTML='<div class="muted" style="padding:22px;text-align:center">지도를 불러오지 못했어요. 핀 아이콘을 눌러 구글 지도에서 확인하세요.</div>'}}

addEventListener('scroll',()=>{const b=document.getElementById('totop');if(b)b.classList.toggle('on',scrollY>300)},{passive:true});
function render(){const y=scrollY;const jumpToNow=S.screen==='preview'&&!render.scrolled;
  if(S.view&&!S.viewTrip){
    $('#app').innerHTML=header()+`<div class="card" style="text-align:center;padding:30px 14px;margin-top:20px">${S.loadErr?'<div style="font-size:38px">📡</div><p>일정을 불러오지 못했어요.<br><span class="muted">링크가 끊겼거나 네트워크 문제일 수 있어요.</span></p><button class="btn" onclick="retryShared()">다시 시도</button>':'<p class="muted">일정을 불러오는 중…</p>'}</div>`;
    syncBg();return}
  const t=trip();if(S.screen!=='list'&&!t)S.screen='list';
  const body={list:screenList,info:screenInfo,exp:screenExp,plan:screenPlan,preview:screenPreview}[S.screen]();
  $('#app').innerHTML=header()+body+nav();
  syncBg();
  if(S.screen==='preview'){const e=$('#hlnow');if(e&&!render.scrolled){render.scrolled=1;setTimeout(()=>{const pt=$('.ptabs');const off=pt?(parseFloat(getComputedStyle(pt).top)||57)+pt.offsetHeight:120;scrollTo({top:Math.max(0,e.getBoundingClientRect().top+scrollY-off-14),behavior:'smooth'})},100)}}
  else render.scrolled=0;
  // 프리뷰 최초 진입 시에는 현재 진행 일정으로 이동하고, 이후 갱신에서는 기존 스크롤 위치를 유지합니다.
  if(S.screen==='preview'){loadWx();const at=document.querySelector('.ptabs .tab.on');if(at){const tb=at.parentElement;tb.scrollLeft=at.offsetLeft-(tb.clientWidth-at.offsetWidth)/2}}
  if(!jumpToNow)scrollTo(0,y)}
setInterval(()=>{if(S.screen==='preview'&&!document.querySelector('details[open]'))render()},30000);
// 공유 링크를 보는 기기는 15초마다 서버의 변경 여부를 확인하고, 변경된 경우에만 화면을 갱신합니다.
setInterval(()=>{pollShared()},30000);

/* ---------- 시작 ---------- */
(async function init(){
  try{setTheme(localStorage.getItem(THEME_KEY)||'light')}catch(e){}
  fetchRates().then(()=>{if(S.screen==='info')render()});
  const h=location.hash;
  const todayIdx=t=>{const td=Math.round((new Date().setHours(0,0,0,0)-parseD(t.start))/864e5);return td>=0&&td<dayCount(t)?td:0};
  if(!window.__SHARED__&&(h.startsWith('#s=')||h.startsWith('#g='))){const id=h.slice(3);
    if(BID.test(id)||parseSrc(id)){S.view=true;S.shareId=id;S.screen='preview';render.scrolled=0;render();await loadShared(id);if(S.viewTrip)S.pday=todayIdx(S.viewTrip);render.scrolled=0;render();return}}
  let shared=null;
  try{if(window.__SHARED__)shared=cleanTrip(window.__SHARED__);else if(h.startsWith('#v='))shared=cleanTrip(await dec(h.slice(3)))}catch(e){shared=null}
  if(shared){S.view=true;S.viewTrip=shared;S.shareId=shared.shareId||null;S.screen='preview';S.pday=todayIdx(shared);render.scrolled=0;render();return}
  await load();render();
  if(gh())cloudSync(false);
})();
</script>
